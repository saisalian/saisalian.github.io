# Site settings - edit the lines below, then commit.
title: Sai Salian
author: Sai Salian
description: Practical notes on Microsoft security, risk and AI governance.
url: "https://saisalian.github.io"
lang: en-IE

# Links shown in the footer. Leave a line commented out to hide it.
github_username: saisalian
# linkedin_username: your-linkedin-handle

theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Pages shown in the top menu
header_pages:
  - about.md

# Show the first paragraph of each post on the home page
show_excerpts: true

minima:
  date_format: "%-d %B %Y"

# Clean post URLs, e.g. /2026/from-msp-to-in-house/
permalink: /:year/:title/

# Never commit drafts to this public repo. Only finished, checked posts go in _posts.
exclude:
  - README.md
